name: Build automatique sur le PC
on:
  push:
  workflow_dispatch:
jobs:
  local-build:
    # Audit branches are compiled/tested manually on Windows; no automatic release.
    if: ${{ !startsWith(github.ref, 'refs/heads/audit/') }}
    runs-on: windows-native
    steps:
      - uses: actions/checkout@v4
      - name: Détection, tests et compilation
        shell: powershell
        run: G:\DevServer\builder\run-build-isolated.ps1 -Project 'TvFlow-v2' -GitHubRepository 'bobcatfr63/TvFlow-v2'
      - uses: actions/upload-artifact@v4
        with:
          name: TvFlow-v2-${{ github.sha }}
          path: local-output/*
          if-no-files-found: ignore
