name: Build automatique sur le PC
on:
  push:
  workflow_dispatch:
jobs:
  local-build:
    runs-on: windows-native
    steps:
      - uses: actions/checkout@v4
      - name: Consolider TVFlow dans TvFlow-v2
        shell: powershell
        run: .\scripts\bootstrap-tvflow-v2.ps1
      - name: Détection, tests et compilation
        shell: powershell
        run: G:\DevServer\builder\run-build-isolated.ps1 -Project 'TvFlow-v2' -GitHubRepository 'bobcatfr63/TvFlow-v2'
      - uses: actions/upload-artifact@v4
        with:
          name: TvFlow-v2-${{ github.sha }}
          path: local-output/*
          if-no-files-found: ignore
